<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline | LineME</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }

      main {
        background: rgb(255 255 255 / 0.86);
        border: 1px solid #e2e8f0;
        border-radius: 2rem;
        box-shadow: 0 24px 60px rgb(15 23 42 / 0.1);
        margin: auto;
        max-width: 32rem;
        padding: 2.5rem;
        text-align: center;
        width: 100%;
      }

      img {
        height: 4.5rem;
        width: 4.5rem;
      }

      h1 {
        font-size: 1.75rem;
        margin: 1.25rem 0 0;
      }

      p {
        color: #475569;
        line-height: 1.65;
        margin: 0.75rem auto 0;
      }

      a {
        background: #0d9488;
        border-radius: 999px;
        color: white;
        display: inline-block;
        font-weight: 700;
        margin-top: 1.5rem;
        padding: 0.8rem 1.25rem;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #030712;
          color: #f8fafc;
        }

        main {
          background: rgb(15 23 42 / 0.9);
          border-color: rgb(255 255 255 / 0.12);
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>
        LineME needs an internet connection to show live queue positions and
        updates. Reconnect, then try again.
      </p>
      <a href="/en">Try again</a>
    </main>
  </body>
</html>
